name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64

jobs:
  check:
    runs-on: namespace-profile-default
    # Ubuntu 24.04 ships Ghostscript 10, whose PDF interpreter the image-skipping test targets.
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install Ghostscript, PDF text tools, and a C compiler for the race detector
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y --no-install-recommends ghostscript poppler-utils gcc libc6-dev ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test both engines
        env:
          PDF_SQUEEZER_INTEGRATION: "1"
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Cross-compile
        run: |
          for target in $TARGETS; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /tmp/pdf-squeezer .
          done

  release:
    if: github.ref_type == 'tag'
    needs: check
    runs-on: namespace-profile-default
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Go stamps the version from the tag on HEAD.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build release binaries
        # Build outside the checkout: files in the tree would mark Go's version stamp +dirty.
        run: |
          mkdir "$RUNNER_TEMP/dist"
          for target in $TARGETS; do
            name="pdf-squeezer_${target%/*}_${target#*/}"
            [ "${target%/*}" = windows ] && name="$name.exe"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/dist/$name" .
          done
          cd "$RUNNER_TEMP/dist"
          test "$(./pdf-squeezer_linux_amd64 --version)" = "$GITHUB_REF_NAME"
          sha256sum * > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "$RUNNER_TEMP"/dist/*

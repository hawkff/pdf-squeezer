name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Set the CI_RUNNER repository variable to move the Linux jobs to another runner label.
env:
  TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'namespace-profile-default' }}
    # Debian 13 ships Ghostscript 10, whose PDF interpreter the image-skipping test targets.
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - name: Install PDF tools and test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y --no-install-recommends ghostscript qpdf poppler-utils gcc g++ make libc6-dev ca-certificates git cmake pkg-config libleptonica-dev jbig2dec python3 python3-venv fonts-dejavu-core fontconfig fonts-urw-base35 fonts-liberation default-jre-headless curl unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod names the oldest supported release; builds take the newest one.
          go-version: stable
          check-latest: true
      - name: Install optional Python tools
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-tools"
          "$RUNNER_TEMP/pdf-tools/bin/pip" install -r tools/requirements.txt ruff==0.17.2
          echo "$RUNNER_TEMP/pdf-tools/bin" >> "$GITHUB_PATH"
      - name: Install lossless JBIG2 encoder
        run: |
          git init "$RUNNER_TEMP/jbig2enc"
          git -C "$RUNNER_TEMP/jbig2enc" remote add origin https://github.com/agl/jbig2enc.git
          git -C "$RUNNER_TEMP/jbig2enc" fetch --depth 1 origin d0dfca46216c98f11312a9c9f15615ed490cd7b3
          git -C "$RUNNER_TEMP/jbig2enc" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/jbig2enc" -B "$RUNNER_TEMP/jbig2enc/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/jbig2enc/build" -j4
          cmake --install "$RUNNER_TEMP/jbig2enc/build"
      - name: Install veraPDF
        run: |
          sh tools/install-verapdf.sh "$RUNNER_TEMP/verapdf"
          echo "$RUNNER_TEMP/verapdf" >> "$GITHUB_PATH"
      - name: Check formatting and Python lint
        run: |
          test -z "$(gofmt -l .)"
          ruff check tools
          ruff format --check tools
      - name: Test both engines
        env:
          PDF_SQUEEZER_INTEGRATION: "1"
        run: go test -race ./...
      - name: Compare PDF rendering and optional operations
        env:
          PDF_SQUEEZER_INTEGRATION: "1"
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Vet
        run: go vet ./...
      - name: Cross-compile
        # The container's checkout is owned by another user, so Go cannot stamp VCS info here.
        run: |
          for target in $TARGETS; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -buildvcs=false -o /tmp/pdf-squeezer .
          done

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install PDF tools and test dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install qpdf ghostscript poppler jbig2dec jbig2enc fontconfig
          # The same metric-compatible fonts as the Linux job, so PDF/A picks the same substitutes.
          brew install --cask font-urw-base35 font-liberation font-dejavu
      - name: Install optional Python tools
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-tools"
          "$RUNNER_TEMP/pdf-tools/bin/pip" install -r tools/requirements.txt
          echo "$RUNNER_TEMP/pdf-tools/bin" >> "$GITHUB_PATH"
      - name: Install veraPDF
        run: |
          sh tools/install-verapdf.sh "$RUNNER_TEMP/verapdf"
          echo "$RUNNER_TEMP/verapdf" >> "$GITHUB_PATH"
      - name: Test both engines
        env:
          PDF_SQUEEZER_INTEGRATION: "1"
        run: go test -race ./...
      - name: Compare PDF rendering and optional operations
        env:
          PDF_SQUEEZER_INTEGRATION: "1"
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  image:
    needs: check
    runs-on: ${{ vars.CI_RUNNER || 'namespace-profile-default' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the build context must not carry the token
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image with every optional tool; push on tags
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
            ghcr.io/${{ github.repository }}:latest

  release:
    if: github.ref_type == 'tag'
    needs: [check, macos, image]
    runs-on: ${{ vars.CI_RUNNER || 'namespace-profile-default' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Go stamps the version from the tag on HEAD.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod names the oldest supported release; builds take the newest one.
          go-version: stable
          check-latest: true
      - name: Build release binaries
        # Build outside the checkout: files in the tree would mark Go's version stamp +dirty.
        run: |
          mkdir "$RUNNER_TEMP/dist"
          for target in $TARGETS; do
            name="pdf-squeezer_${target%/*}_${target#*/}"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/dist/$name" .
          done
          cp tools/requirements.txt "$RUNNER_TEMP/dist/pdf-tools-requirements.txt"
          cd "$RUNNER_TEMP/dist"
          test "$(./pdf-squeezer_linux_amd64 --version)" = "$GITHUB_REF_NAME"
          sha256sum * > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "$RUNNER_TEMP"/dist/*

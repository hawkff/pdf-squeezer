[package]
name = "pdf-squeezer"
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
description = "Compress PDF files and convert them to PDF/A"
license = "MIT"
repository = "https://github.com/hawkff/pdf-squeezer"
publish = false

[dependencies]
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4"
hayro-ccitt = "0.5"
jpeg-encoder = { version = "0.7", features = ["simd"] }
libc = "0.2"
lopdf = { version = "0.47", default-features = false, features = ["rayon"] }
quick-xml = "0.42"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = "0.4"
weezl = "0.2"
zune-core = "0.5"
zune-jpeg = "0.5"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true

# Image codecs dominate test time; optimize them even in debug test builds.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3"
